version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  python-service:
    build: ./python-service
    ports:
      - "8002:8002"
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHON_SERVICE_URL=http://python-service:8002
    depends_on:
      - python-service
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Uses the mongo container above by default. Set MONGO_URI in the
      # repo-root .env (e.g. to an Atlas connection string) to override.
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/healthbridge}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - PYTHON_SERVICE_URL=http://python-service:8002
    depends_on:
      - mongo
      - python-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
        VITE_AI_API_BASE_URL: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped

volumes:
  mongo-data:
