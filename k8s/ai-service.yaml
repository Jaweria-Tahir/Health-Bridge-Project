apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: healthbridge-ai-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healthbridge-secrets
                  key: groq-api-key
            - name: PYTHON_SERVICE_URL
              value: "http://python-service:8002"
            - name: BACKEND_URL
              value: "http://backend:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
