apiVersion: v1
kind: Secret
metadata:
  name: healthbridge-secrets
type: Opaque
stringData:
  groq-api-key: "replace-with-your-groq-api-key"
  jwt-secret: "replace-with-output-of-openssl-rand-hex-32"
  mongo-user: "healthbridge"
  mongo-password: "replace-with-a-strong-mongo-password"
  # In-cluster Mongo (matches k8s/mongo.yaml):
  mongo-uri: "mongodb://healthbridge:replace-with-a-strong-mongo-password@mongo:27017/healthbridge?authSource=admin"
  # Production Atlas example (swap mongo-uri to this and you can skip deploying mongo.yaml):
  # mongo-uri: "mongodb+srv://USER:URL_ENCODED_PASSWORD@CLUSTER.mongodb.net/healthbridge?retryWrites=true&w=majority"
