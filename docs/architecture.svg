<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>HealthBridge architecture</title>
<desc>Four independently deployable services: a React frontend calling a Node/Express backend and a FastAPI AI service; the backend uses MongoDB Atlas and proxies resource analysis to a Python service; the AI service also calls the Python service and the Groq API.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>

<line x1="300" y1="86" x2="190" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="86" x2="490" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="150" y1="196" x2="120" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="230" y1="196" x2="290" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="450" y1="196" x2="390" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="530" y1="196" x2="545" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<text x="230" y="106" text-anchor="middle" font-size="12" fill="#5F5E5A">/api</text>
<text x="455" y="106" text-anchor="middle" font-size="12" fill="#5F5E5A">/ask, /agent</text>

<g>
<rect x="250" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Frontend</text>
<text x="340" y="70" text-anchor="middle" font-size="12" fill="#3C3489">React + Vite</text>
</g>

<g>
<rect x="90" y="140" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Backend API</text>
<text x="190" y="180" text-anchor="middle" font-size="12" fill="#085041">Express + JWT auth</text>
</g>

<g>
<rect x="390" y="140" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">AI service</text>
<text x="490" y="180" text-anchor="middle" font-size="12" fill="#712B13">FastAPI RAG + agent</text>
</g>

<g>
<rect x="40" y="260" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">MongoDB Atlas</text>
<text x="120" y="300" text-anchor="middle" font-size="12" fill="#444441">App data store</text>
</g>

<g>
<rect x="250" y="260" width="180" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#4B1528">Python service</text>
<text x="340" y="300" text-anchor="middle" font-size="12" fill="#72243E">Classify + search</text>
</g>

<g>
<rect x="470" y="260" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Groq API</text>
<text x="545" y="300" text-anchor="middle" font-size="12" fill="#444441">Chat completions</text>
</g>
</svg>
